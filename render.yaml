# Render Blueprint Specification for CineSphere Backend REST API
# Documentation: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: cinesphere-backend
    env: python
    buildCommand: pip install -r requirements.txt && python train.py
    startCommand: gunicorn backend.app:app
    envVars:
      - key: TMDB_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.11.8
